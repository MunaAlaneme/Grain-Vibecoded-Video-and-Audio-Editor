[package]
name = "app"
version = "0.1.0"
description = "Grain Video Editor — Rust core"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"

# Optional FFmpeg bindings — enable with --features ffmpeg
# Requires system libavcodec/libavformat/libavutil (and friends) + pkg-config.
# ffmpeg-next = { version = "7", optional = true }

[features]
default = []
ffmpeg = []
# ffmpeg = ["dep:ffmpeg-next"]
