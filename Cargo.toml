[package]
name = "grain-video-editor"
version = "0.6.3"
edition = "2021"
description = "Grain Video & Audio Editor — Complete 100% Pure Rust Port + OpenFX (.ofx.bundle) Host + Full BorisFX Sapphire S_ Suite"
authors = ["Grain"]

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
rfd = "0.15"
hound = "3.5"
rustfft = "6.2"
libloading = "0.8"

[package.metadata.bundle]
name = "Grain Video Editor"
identifier = "com.grain.videoeditor"
icon = ["assets/icons/icon.icns", "assets/icons/128x128@2x.png"]
version = "0.6.3"
copyright = "Copyright (c) Grain"
category = "public.app-category.video"
short_description = "Native Rust Video & Audio Studio + OpenFX Host for Apple Silicon"
long_description = "100% Pure Rust desktop video and audio editor with native OpenFX (.ofx.bundle) plugin host, full BorisFX Sapphire S_ suite, and macOS VideoToolbox."

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
