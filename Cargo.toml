[package]
name = "vegas-ui-reference"
version = "0.1.0"
edition = "2021"
authors = ["Grain"]
description = "Vegas Pro 17 UI reference shell in pure Rust + egui 0.29 (matches the three reference screenshots)"

[dependencies]
# Pinned to the SAME versions used by the Grain Video Editor project
# (see Cargo.lock: egui 0.29.1, eframe 0.29). This file drops straight in.
eframe = { version = "0.29", default-features = true }
egui = "0.29"
# PNG decoding for the embedded Grain logo + splash background (include_bytes!).
# Only the png decoder is enabled to keep the dependency footprint small.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
