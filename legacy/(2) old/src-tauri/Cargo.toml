[package]
name = "app"
version = "0.1.0"
description = "Grain Video Editor — Rust core"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rustfft = "6.2"
hound = "3.5"

# Optional native FFmpeg bindings (brew install ffmpeg pkg-config on macOS)
ffmpeg-next = { version = "7", optional = true }

[features]
default = []
ffmpeg = ["dep:ffmpeg-next"]
